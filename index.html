<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Hello World</title>
    <style>
      
        /* CSS: Styling and Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a; /* Dark sleek slate background */
            color: #f8fafc;
            overflow: hidden;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem 4rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8; /* Soft blue glow on hover */
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            /* Gradient text effect */
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 4.5rem; /* Prevents layout shifting during typing */
        }

        p {
            color: #94a3b8;
            margin-top: 1rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- HTML: Structure -->
    <div class="card">
        <h1 id="greeting"></h1>
        <p>Built beautifully with HTML, CSS, & JavaScript</p>
    </div>

    <!-- JavaScript: Dynamic Typing Effect -->
    <script>
        const text = "Hello, 👋 still u have time to think the card will not gonna work";
        const greetingElement = document.getElementById("greeting");
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                greetingElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120); // Speed of typing in milliseconds
            }
        }

        // Run the script automatically when the page loads
        window.onload = typeWriter;
    </script>
</body>
</html>
